name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v5
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_OWNER }}/vedic-astrology-backend:latest
            ghcr.io/${{ secrets.GHCR_OWNER }}/vedic-astrology-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_OWNER }}/vedic-astrology-frontend:latest
            ghcr.io/${{ secrets.GHCR_OWNER }}/vedic-astrology-frontend:${{ github.sha }}

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy production compose to remote host
        run: |
          scp -o StrictHostKeyChecking=no docker-compose.prod.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/docker-compose.prod.yml

      - name: Deploy on remote host
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cat > /tmp/.env <<'EOF'
          GHCR_OWNER=${{ secrets.GHCR_OWNER }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          EOF
          docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} -p ${{ secrets.GHCR_TOKEN }} && \
          docker-compose -f /tmp/docker-compose.prod.yml --env-file /tmp/.env pull && \
          docker-compose -f /tmp/docker-compose.prod.yml --env-file /tmp/.env up -d"
        env:
          SSH_AUTH_SOCK: ${{ steps.ssh-agent.outputs.ssh-auth-sock }}
