name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install
      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python (for backend preview)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend dependencies (for E2E)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Start backend server
        run: |
          nohup python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          sleep 2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install
      - name: Build frontend (again for artifact)
        working-directory: frontend
        run: |
          npm run build
      - name: Start preview server
        working-directory: frontend
        run: |
          npm run preview -- --port 8080 &
          sleep 2
      - name: Install Playwright browsers
        working-directory: frontend
        run: |
          npx playwright install --with-deps
      - name: Run Playwright tests (generate HTML + list reporters)
        working-directory: frontend
        run: |
          npx playwright test --reporter=list,html
      - name: Package Playwright artifacts for upload
        if: always()
        working-directory: frontend
        run: |
          set -e
          mkdir -p playwright-artifacts || true
          cp -r playwright-report playwright-artifacts/ || true
          cp -r test-results playwright-artifacts/ || true
          if command -v zip >/dev/null 2>&1; then
            zip -r playwright-artifacts.zip playwright-artifacts || true
          else
            tar -czf playwright-artifacts.tar.gz playwright-artifacts || true
          fi
      - name: Upload Playwright artifacts (packaged)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-artifacts.zip
            frontend/playwright-artifacts.tar.gz
            frontend/playwright-artifacts
