version: '3.8'

services:
  backend:
    image: ghcr.io/${GHCR_OWNER}/vedic-astrology-backend:latest
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  frontend:
    image: ghcr.io/${GHCR_OWNER}/vedic-astrology-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
